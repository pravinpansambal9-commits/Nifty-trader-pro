
name: Build NIFTY TRADER PRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: unzip -q NiftyTraderPro_AndroidStudio_Project.zip -d source

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-TRADER-PRO-APK
          path: source/**/build/outputs/apk/debug/*.apk
